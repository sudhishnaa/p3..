<!DOCTYPE html>
<html>
<head>
    <title>PetSphere - Pet Reservation Form</title>
</head>
<body>

    <h3>PetSphere - Pet Reservation Form</h3>

    <form>
        <label for="fname">Owner First Name:</label><br>
        <input type="text" id="fname" name="fname" required>
        <br>

        <label for="lname">Owner Last Name:</label><br>
        <input type="text" id="lname" name="lname" required>
        <br>

        <label for="petname">Pet Name:</label><br>
        <input type="text" id="petname" name="petname" required>
        <br>

        <label for="pettype">Pet Type:</label><br>
        <select id="pettype" name="pettype" required>
            <option value="">Select Pet</option>
            <option>Dog</option>
            <option>Cat</option>
            <option>Bird</option>
            <option>Rabbit</option>
            <option>Fish</option>
            <option>Other</option>
        </select>
        <br>

        <label for="breed">Breed:</label><br>
        <input type="text" id="breed" name="breed">
        <br>

        <label for="age">Pet Age:</label><br>
        <input type="number" id="age" name="age" min="0" required>
        <br>

        <label for="address">Address:</label><br>
        <input type="text" id="address" name="address" required>
        <br>

        <label for="city">City:</label><br>
        <input type="text" id="city" name="city" required>
        <br>

        <label for="state">State:</label><br>
        <input type="text" id="state" name="state" required>
        <br>

        <label for="zip">Zip Code:</label><br>
        <input type="text" id="zip" name="zip" required>
        <br>

        <label for="date">Reservation Date:</label><br>
        <input type="date" id="date" name="date" required>
        <br>

        <label for="time">Reservation Time:</label><br>
        <input type="time" id="time" name="time" required>
        <br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" required>
        <br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required>
        <br>

        <label for="service">Service Required:</label><br>
        <select id="service" name="service" required>
            <option value="">Select Service</option>
            <option>Pet Grooming</option>
            <option>Veterinary Consultation</option>
            <option>Pet Boarding</option>
            <option>Pet Training</option>
            <option>Pet Adoption</option>
        </select>
        <br>

        <label>Payment Method:</label><br>
        <input type="radio" id="cash" name="payment" value="Cash">
        <label for="cash">Cash</label>

        <input type="radio" id="card" name="payment" value="Card">
        <label for="card">Card</label>

        <input type="radio" id="online" name="payment" value="Online">
        <label for="online">Online Payment</label>
        <br>

        <label for="requests">Special Requests:</label><br>
        <textarea id="requests" name="requests" rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
